<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ratio Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background-color: #f9f9f9;
    }
    .slider-container {
      margin: 20px 0;
    }
    input[type="range"] {
      width: 100%;
    }
    .output {
      font-size: 1.2em;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ratio Calculator</h1>
    <label for="ratio-width">Width:</label>
    <input type="number" id="ratio-width" value="16" min="1" style="width: 60px;"> : 
    <label for="ratio-height">Height:</label>
    <input type="number" id="ratio-height" value="9" min="1" style="width: 60px;">

    <div class="slider-container">
      <label for="ratio-slider">Adjust Ratio:</label>
      <input type="range" id="ratio-slider" min="0.1" max="2" step="0.01" value="1">
      <p>Multiplier: <span id="slider-value">1</span></p>
    </div>

    <div class="output">
      <p>New Ratio: <span id="new-ratio">16 : 9</span></p>
    </div>
  </div>

  <script>
    const widthInput = document.getElementById('ratio-width');
    const heightInput = document.getElementById('ratio-height');
    const slider = document.getElementById('ratio-slider');
    const sliderValueDisplay = document.getElementById('slider-value');
    const newRatioDisplay = document.getElementById('new-ratio');

    function calculateRatio() {
      const width = parseFloat(widthInput.value);
      const height = parseFloat(heightInput.value);
      const multiplier = parseFloat(slider.value);

      const newWidth = (width * multiplier).toFixed(2);
      const newHeight = (height * multiplier).toFixed(2);

      sliderValueDisplay.textContent = multiplier.toFixed(2);
      newRatioDisplay.textContent = `${newWidth} : ${newHeight}`;
    }

    // Event Listeners
    widthInput.addEventListener('input', calculateRatio);
    heightInput.addEventListener('input', calculateRatio);
    slider.addEventListener('input', calculateRatio);

    // Initial Calculation
    calculateRatio();
  </script>
</body>
</html>
