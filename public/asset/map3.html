<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maharashtra Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@latest/dist/leaflet.css" />
    <link rel="stylesheet" href="/asset/map.css" />
    <style>
        .leaflet-interactive {
            outline: none !important;
        }
    </style>
</head>

<body>

    <div id="map" data-tap-disabled="true">
    </div>
    
    <img id="changeTileProvider" src="/btns/exchange.png" 
    style="position: absolute; bottom: 15px; right: 15px; z-index: 1000; cursor: pointer; width: 28px; height: 28px;" />

    <script src="https://unpkg.com/leaflet@latest/dist/leaflet.js"></script>
    <script src="polygon.js"></script>
    <script>

        const tileProviders = [
            'http://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
            'http://services.arcgisonline.com/arcgis/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}'
        ];
        let currentTileProvider = 0;

        var mapOptions = {
            center: [19.0760, 72.8777],
            zoom: 2,
            zoomControl: false,
            tap: false,
            touchZoom: true,
            scrollWheelZoom: true,
            doubleClickZoom: false,
            minZoom: 4,
            maxZoom: 8,
            attributionControl: false,
        };

        function main() {
            const map = L.map('map', mapOptions);
            let tileLayer = L.tileLayer(tileProviders[currentTileProvider]).addTo(map);

            map.whenReady(async function () {

            polygons.forEach(polygon => {

                let formattedText = polygon.text.replace(/\b\w/g, char => char.toUpperCase()); 

                let poly = L.polygon(polygon.coords, {
                    color: 'blue',       
                    fillColor: 'lightblue', 
                    fillOpacity: 0.5
                }).addTo(map);

                poly.bindTooltip(`<b>${formattedText}</b>`, { permanent: false, direction: "top", sticky: true });
            });

            });

            document.getElementById('changeTileProvider').addEventListener('click', function () {
                currentTileProvider = (currentTileProvider + 1) % tileProviders.length;
                map.removeLayer(tileLayer);
                tileLayer = L.tileLayer(tileProviders[currentTileProvider]).addTo(map);
            });

        }

        document.addEventListener('DOMContentLoaded', main);

    </script>
</body>

</html>
