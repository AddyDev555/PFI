<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maharashtra Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@latest/dist/leaflet.css" />
    <link rel="stylesheet" href="/asset/map.css" />
</head>
<body>
    <div id="map" data-tap-disabled="true">
        <canvas id="overlayCanvas"></canvas>
    </div>
    <div class="opacitySlider">
        <input id="opacityRange" type="range" min="0" max="1" step="0.1" value="0" oninput="window.updateOpacity(this.value)" />
        <p id="opacityValue">Scroll for Hint's: 0</p>
    </div>
    <button id="changeTileProvider" style="position: absolute; bottom: 10px; right: 10px; z-index: 1000;">Change Tile Provider</button>
    <script src="https://unpkg.com/leaflet@latest/dist/leaflet.js"></script>
    <script>
        let containerPoints = {};
        const imageCache = {};
        let startX = 0;
        let startY = 0;
        let isDragging = false;
        let clientX = 0;
        let clientY = 0;
        let opacityValue = 1;

        const tileProviders = [
            'http://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
            'http://services.arcgisonline.com/arcgis/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}',
            'http://services.arcgisonline.com/arcgis/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}',
            'http://services.arcgisonline.com/arcgis/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
        ];
        let currentTileProvider = 0;

        var mapOptions = {
            center: [19.0760, 72.8777],
            zoom: 4,
            zoomControl: false,
            tap: false,
            touchZoom: true,
            scrollWheelZoom: true,
            doubleClickZoom: false,
            minZoom: 4,
            maxZoom: 11,
            attributionControl: false
        };

        const pointsData = [
            {
                "img": "mapHR.png",
                "lat": 24.351399328153236,
                "lng": 81.9337890625
            },
            {
                "img": "mapHM.png",
                "lat": 24.351399328153236,
                "lng": 81.9337890625
            },
            {
                "img": "mapRM.png",
                "lat": 24.351399328153236,
                "lng": 81.9337890625
            }
        ];

        function preloadImages() {
            const preloadPromises = pointsData.map((point) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.src = point.img;
                    imageCache[point.img] = img;
                    img.onload = resolve;
                });
            });

            return Promise.all(preloadPromises);
        }

        function main() {
            const map = L.map('map', mapOptions);

            let tileLayer = L.tileLayer(tileProviders[currentTileProvider]).addTo(map);

            const overlayCanvas = document.getElementById('overlayCanvas');
            const ctx = overlayCanvas.getContext('2d');

            function drawPoints() {
                if (!ctx) return;
                ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                ctx.globalAlpha = opacityValue;

                requestAnimationFrame(() => {
                    ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                    const zoomLevel = map.getZoom();
                    const scaleFactor = Math.pow(2, zoomLevel - mapOptions.minZoom);

                    for (const [name, point] of Object.entries(containerPoints)) {
                        const img = imageCache[name];
                        if (img && img.complete) {
                            const baseWidth = 376.80;
                            const baseHeight = 391.20;
                            const imgWidth = baseWidth * scaleFactor;
                            const imgHeight = baseHeight * scaleFactor;
                            ctx.drawImage(img, point.x - imgWidth / 2, point.y - imgHeight / 2, imgWidth, imgHeight);
                        }
                    }
                });
            }

            map.on('resize', function () {
                const size = map.getSize();
                overlayCanvas.width = size.x;
                overlayCanvas.height = size.y;
                for (const [name, latLng] of Object.entries(pointsData)) {
                    containerPoints[latLng.img] = map.latLngToContainerPoint(latLng);
                }
                drawPoints();
            });

            map.whenReady(async function () {
                await preloadImages();
                map.fire('resize');
                for (const [name, latLng] of Object.entries(pointsData)) {
                    containerPoints[latLng.img] = map.latLngToContainerPoint(latLng);
                }
                drawPoints();

                setInterval(() => {
                    map.fire('resize');
                }, 2000);
            });

            function startPaint(e) {
                painting = true;
                lastX = e.clientX || e.touches[0].clientX;
                lastY = e.clientY || e.touches[0].clientY;
            }

            function stopPaint() {
                painting = false;
            }

            function drawPaint(e) {
                if (!painting) return;
                const currentX = e.clientX || e.touches[0].clientX;
                const currentY = e.clientY || e.touches[0].clientY;

                ctx.beginPath();
                ctx.moveTo(lastX - overlayCanvas.offsetLeft, lastY - overlayCanvas.offsetTop);
                ctx.lineTo(currentX - overlayCanvas.offsetLeft, currentY - overlayCanvas.offsetTop);
                ctx.strokeStyle = paintColor;
                ctx.lineWidth = paintWidth;
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.closePath();

                lastX = currentX;
                lastY = currentY;
            }

            overlayCanvas.addEventListener('mousedown', startPaint);
            overlayCanvas.addEventListener('mouseup', stopPaint);
            overlayCanvas.addEventListener('mousemove', drawPaint);

            overlayCanvas.addEventListener('touchstart', startPaint);
            overlayCanvas.addEventListener('touchend', stopPaint);
            overlayCanvas.addEventListener('touchmove', drawPaint);

            overlayCanvas.addEventListener('mouseleave', stopPaint);

            map.on('drag', function (e) {
                drawPoints();
            });

            map.on('zoomend', function (e) {
                for (const [name, latLng] of Object.entries(pointsData)) {
                    containerPoints[latLng.img] = map.latLngToContainerPoint(latLng);
                }
                drawPoints();
            });

            map.dragging.disable();

            function updateOpacity(value) {
                opacityValue = parseFloat(value);
                document.getElementById('opacityValue').textContent = `Opacity: ${value}`;
                drawPoints();
            }
            window.updateOpacity = updateOpacity;
                        
            document.getElementById('changeTileProvider').addEventListener('click', function () {
                currentTileProvider = (currentTileProvider + 1) % tileProviders.length;
                map.removeLayer(tileLayer);
                tileLayer = L.tileLayer(tileProviders[currentTileProvider]).addTo(map);
            });

        }

        document.addEventListener('DOMContentLoaded', main);
    </script>
</body>
</html>
