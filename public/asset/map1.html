<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maharashtra Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@latest/dist/leaflet.css" />
    <link rel="stylesheet" href="/asset/map.css" />
</head>

<body>
    <div id="map" data-tap-disabled="true">
        <canvas id="overlayCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
    </div>
    <div class="opacitySlider">
    <input id="opacityRange" type="range" min="0" max="1" step="0.1" value="1" oninput="window.updateOpacity(this.value)" />
    </div>
    <button id="changeTileProvider" style="position: absolute; bottom: 10px; right: 10px; z-index: 1000;">Change Tile Provider</button>
    <button id="toggleDraw" style="position: absolute; bottom: 50px; right: 10px; z-index: 1000;">Enable Drawing</button>
    <button id="compareDraw" style="position: absolute; bottom: 90px; right: 10px; z-index: 1000;">Compare Area</button>

    <script src="https://unpkg.com/leaflet@latest/dist/leaflet.js"></script>
    <script>

        let containerPoints = {};
        const imageCache = {};
        let startX = 0;
        let startY = 0;
        let isDragging = false;
        let clientX = 0;
        let clientY = 0;
        let opacityValue = 1;

        let drawingEnabled = false;
        let isDrawing = false;
        let geoStrokes = []; 
        let currentGeoStroke = null;


        const tileProviders = [
            'http://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
            'http://services.arcgisonline.com/arcgis/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}',
            'http://services.arcgisonline.com/arcgis/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}',
            'http://services.arcgisonline.com/arcgis/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
        ];
        let currentTileProvider = 0;

        var mapOptions = {
            center: [19.0760, 72.8777],
            zoom: 4,
            zoomControl: false,
            tap: false,
            touchZoom: true,
            scrollWheelZoom: true,
            doubleClickZoom: false,
            minZoom: 4,
            maxZoom: 11,
            attributionControl: false
        };

        const pointsData = [
            {
                "img": "mapHR.png",
                "lat": 24.351399328153236,
                "lng": 81.9337890625
            },
            {
                "img": "mapHM.png",
                "lat": 24.351399328153236,
                "lng": 81.9337890625
            },
            {
                "img": "mapRM.png",
                "lat": 24.351399328153236,
                "lng": 81.9337890625
            }
        ];

        function preloadImages() {
            const preloadPromises = pointsData.map((point) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.src = point.img;
                    imageCache[point.img] = img;
                    img.onload = resolve;
                });
            });

            return Promise.all(preloadPromises);
        }

        function main() {

            const map = L.map('map', mapOptions);

            let tileLayer = L.tileLayer(tileProviders[currentTileProvider]).addTo(map);

            const overlayCanvas = document.getElementById('overlayCanvas');
            const ctx = overlayCanvas.getContext('2d');

            const drawCanvas = document.getElementById('drawCanvas');
            const drawCtx = drawCanvas.getContext('2d');

            function drawPoints() {
                if (!ctx) return;
                ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

                ctx.globalAlpha = opacityValue;

                requestAnimationFrame(() => {
                    ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                    const zoomLevel = map.getZoom();
                    const scaleFactor = Math.pow(2, zoomLevel - mapOptions.minZoom);

                    for (const [name, point] of Object.entries(containerPoints)) {
                        const img = imageCache[name];
                        if (img && img.complete) {

                            const baseWidth = 376.80;
                            const baseHeight = 391.20;
                            const imgWidth = baseWidth * scaleFactor;
                            const imgHeight = baseHeight * scaleFactor;

                            ctx.drawImage(img, point.x - imgWidth / 2, point.y - imgHeight / 2, imgWidth, imgHeight);
                        }
                    }
                });
            }

            map.on('resize', function () {
                const size = map.getSize();
                overlayCanvas.width = size.x;
                overlayCanvas.height = size.y;
                drawCanvas.width = size.x;
                drawCanvas.height = size.y;
                for (const [name, latLng] of Object.entries(pointsData)) {
                    containerPoints[latLng.img] = map.latLngToContainerPoint(latLng);
                }
                drawPoints();
                redrawStrokes();
            });

            map.whenReady(async function () {

                await preloadImages();

                map.fire('resize');
                for (const [name, latLng] of Object.entries(pointsData)) {
                    containerPoints[latLng.img] = map.latLngToContainerPoint(latLng);
                }

                drawPoints();

                setInterval(() => {
                    map.fire('resize');
                }, 2000);
            });


            function handleEvent(eventName, e) {
                try {
                    if (e && (e.originalEvent?.type || e.type)) {
                        const clientX = e.originalEvent?.clientX || e.clientX || e.changedTouches?.[0]?.clientX;
                        const clientY = e.originalEvent?.clientY || e.clientY || e.changedTouches?.[0]?.clientY;

                        if (clientX !== undefined && clientY !== undefined) {
                            if (eventName === 'movestart' || eventName === 'pointerdown') {
                                startX = clientX;
                                startY = clientY;
                                isDragging = true;
                            } else if ((eventName === 'drag' || eventName === 'touchmove') && isDragging) {
                                const dragDeltaX = clientX - startX;
                                const dragDeltaY = clientY - startY;

                                for (const [name, point] of Object.entries(containerPoints)) {
                                    containerPoints[name].x += dragDeltaX;
                                    containerPoints[name].y += dragDeltaY;
                                }

                                startX = clientX;
                                startY = clientY;
                            } else if (eventName === 'pointerup' || eventName === 'touchend') {
                                isDragging = false;
                            }

                            drawPoints();
                            redrawStrokes();
                        }
                    }
                } catch (error) {
                    console.error('Logging error:', error);
                }
            }

            overlayCanvas.addEventListener('pointerdown', function (e) { handleEvent('pointerdown', e); map.dragging.enable(); });
            overlayCanvas.addEventListener('pointerup', function (e) { handleEvent('pointerup', e); map.dragging.disable(); });
            overlayCanvas.addEventListener('touchmove', function (e) { if (e.touches.length === 1) { handleEvent('touchmove', e); } });
            overlayCanvas.addEventListener('mouseleave', function () { map.dragging.disable(); });
            overlayCanvas.addEventListener('mousedown', function (e) { handleEvent('movestart', e); map.dragging.enable(); });
            overlayCanvas.addEventListener('mouseup', function (e) { handleEvent('moveend', e); map.dragging.disable(); });

            map.on('drag', function (e) { handleEvent('drag', e); });

            map.on('zoomend', function (e) {
                for (const [name, latLng] of Object.entries(pointsData)) {
                    containerPoints[latLng.img] = map.latLngToContainerPoint(latLng);
                }
                drawPoints();
                redrawStrokes();
            });

            map.dragging.disable();

            function updateOpacity(value) {
                opacityValue = parseFloat(value);
                drawPoints();
            }
            window.updateOpacity = updateOpacity;
                        
            document.getElementById('changeTileProvider').addEventListener('click', function () {
                currentTileProvider = (currentTileProvider + 1) % tileProviders.length;
                map.removeLayer(tileLayer);
                tileLayer = L.tileLayer(tileProviders[currentTileProvider]).addTo(map);
            });

            document.getElementById('toggleDraw').addEventListener('click', function () {
                drawingEnabled = !drawingEnabled;

                if (drawingEnabled) {
                    map.dragging.disable();
                    drawCanvas.style.zIndex = '402';
                } else {
                    map.dragging.enable();
                    drawCanvas.style.zIndex = '-100';
                }

                redrawStrokes();

                this.innerText = drawingEnabled ? "Disable Drawing" : "Enable Drawing";
            });

            drawCanvas.addEventListener('contextmenu', function(e) {
                e.preventDefault(); 
                if (drawingEnabled && geoStrokes.length > 0) {
                    geoStrokes.pop(); 
                    redrawStrokes();  
                }
            });

            drawCanvas.addEventListener('mousedown', function (e) {
                console.log(e)
                if (e.buttons == 1) {
                    map.dragging.disable();
                    if (!drawingEnabled) return;
                    isDrawing = true;
                    const geoPoint = screenToGeo(e.offsetX, e.offsetY, map);
                    currentGeoStroke = {
                        points: [{
                            screen: { x: e.offsetX, y: e.offsetY },
                            geo: { lat: geoPoint.lat, lng: geoPoint.lng }
                        }]
                    };
                    drawCtx.beginPath();
                    drawCtx.moveTo(e.offsetX, e.offsetY);
                } else if (e.buttons == 4) {
                    map.dragging.enable();
                }
            });

            drawCanvas.addEventListener('mousemove', function (e) {
                if (isDrawing) {
                    const geoPoint = screenToGeo(e.offsetX, e.offsetY, map);
                    currentGeoStroke.points.push({
                        screen: { x: e.offsetX, y: e.offsetY },
                        geo: { lat: geoPoint.lat, lng: geoPoint.lng }
                    });
                    drawCtx.lineTo(e.offsetX, e.offsetY);
                    drawCtx.strokeStyle = 'red';
                    drawCtx.lineWidth = getStrokeWidth(map);
                    drawCtx.stroke();
                }
            });

            drawCanvas.addEventListener('mouseup', function () {
                if (isDrawing) {
                    geoStrokes.push(currentGeoStroke);
                    currentGeoStroke = null;
                    isDrawing = false;
                }
            });

            document.getElementById('compareDraw').addEventListener('click', function () {
                redrawStrokes();

                const drawData = drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
                const overlayData = ctx.getImageData(0, 0, overlayCanvas.width, overlayCanvas.height);

                let drawPixels = 0, overlayPixels = 0;

                for (let i = 0; i < drawData.data.length; i += 4) {
                    const isDrawn = drawData.data[i + 3] > 0;
                    const isOverlay = overlayData.data[i + 3] > 0;
                    if (isDrawn) drawPixels++;
                    if (isOverlay) overlayPixels++;
                }

                const ratio = overlayPixels ? (drawPixels / overlayPixels).toFixed(2) : 0;
                alert(`Drawn Area / Image Area Ratio: ${ratio}`);
            });

            function screenToGeo(x, y, map) {
                const point = L.point(x, y);
                const latLng = map.containerPointToLatLng(point);
                return latLng;
            }

            function geoToScreen(lat, lng, map) {
                const latLng = L.latLng(lat, lng);
                const point = map.latLngToContainerPoint(latLng);
                return point;
            }

            function getStrokeWidth(map) {
                const zoom = map.getZoom();
                const baseWidth = 3; 
                return baseWidth * Math.pow(1.2, zoom - mapOptions.minZoom); 
            }

            function redrawStrokes() {
                drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                
                geoStrokes.forEach(stroke => {
                    if (stroke.points.length > 0) {
                        drawCtx.beginPath();
                        
                        const firstPoint = geoToScreen(
                            stroke.points[0].geo.lat,
                            stroke.points[0].geo.lng,
                            map
                        );
                        drawCtx.moveTo(firstPoint.x, firstPoint.y);
                        
                        for (let i = 1; i < stroke.points.length; i++) {
                            const screenPoint = geoToScreen(
                                stroke.points[i].geo.lat,
                                stroke.points[i].geo.lng,
                                map
                            );
                            drawCtx.lineTo(screenPoint.x, screenPoint.y);
                        }
                        
                        drawCtx.strokeStyle = 'red';
                        drawCtx.lineWidth = getStrokeWidth(map);
                        drawCtx.stroke();
                    }
                });

                if (currentGeoStroke && currentGeoStroke.points.length > 0) {
                    drawCtx.beginPath();
                    const firstPoint = geoToScreen(
                        currentGeoStroke.points[0].geo.lat,
                        currentGeoStroke.points[0].geo.lng,
                        map
                    );
                    drawCtx.moveTo(firstPoint.x, firstPoint.y);
                    
                    for (let i = 1; i < currentGeoStroke.points.length; i++) {
                        const screenPoint = geoToScreen(
                            currentGeoStroke.points[i].geo.lat,
                            currentGeoStroke.points[i].geo.lng,
                            map
                        );
                        drawCtx.lineTo(screenPoint.x, screenPoint.y);
                    }
                    
                    drawCtx.strokeStyle = 'red';
                    drawCtx.lineWidth = getStrokeWidth(map);
                    drawCtx.stroke();
                }
            }

        }

        document.addEventListener('DOMContentLoaded', main);

    </script>
</body>

</html>
