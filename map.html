<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maharashtra Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@latest/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }

    #map { height: 100%; width: 100%; position: relative; touch-action: none; }

    #overlayCanvas { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 401; 
    }

    .simulationCon {
        width: 80%;
        height: 85vh;
        margin: auto;
        margin-top: 3.55%;
        background-color: lightblue;
        display: flex;
        justify-content: center; 
        align-items: center; 
        position: relative; 
        padding: 2px; 
        border-radius: 5px;
        overflow: hidden; 
    }

    .mainCon {
        width: 100%; 
        height: 100%;
    }

    .instructionCon {
        position: absolute; 
        top: 10px; 
        left: 10px; 
        width: 20%; 
        height: auto; 
        background-color: white;
        padding: 10px;
        border: 1px solid #ccc; 
        border-radius: 5px; 
        z-index: 402;
        overflow-y: auto;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); 
    }

    .instructionCon h1{
        font-size: 1.2rem;
        color: black;
        width: 58%;
        margin: auto;
        margin-top: 10px;
        font-family: "Roboto Slab", serif;
    }

    .himalayas_drawCon{
        margin-top: 20px;
        padding-left: 7px;
        padding-right: 7px;
    }

    .himalayas_drawCon h2{
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 0;
    }

    .himalayas_drawCon p{
        text-align: justify;
        font-size: 0.8rem;
        margin-top: 3px;
    }

    .paintsCon h2{
        margin-bottom: 7px;
    }

    .paints{
        display: flex;
        align-items: center;
        align-content: center;
        cursor: pointer;
        width: 33%;
        padding: 5px 5px;
        margin-top: 5px;
        border-radius: 5px;
    }

    .paints:hover{
        background-color: whitesmoke;
    }

    .greenColor{
        width: 15px;
        height: 15px;
        border-radius: 2px;
        background-color: green;
    }

    .brownColor{
        width: 15px;
        height: 15px;
        border-radius: 2px;
        background-color: brown;
    }

    .paints span{
        font-size: 0.9rem;
        margin-left: 5px;
    }
  </style>
</head>
<body>
    <div class="simulationCon">
        <div class="instructionCon">
            <h1>Instructions</h1>
            <div class="himalayas_drawCon">
                <h2>Topic 1: Himalayan Ranges</h2>
                <p>Paint the Himalayan Mountain Ranges, Select paint and hover the mouse on the appropriate regions.</p>
                <div class="paintsCon">
                    <h2>Colors</h2>
                    <div class="paints">
                        <div class="greenColor"></div>
                        <span>Green</span>
                    </div>
                    <div class="paints">
                        <div class="brownColor"></div>
                        <span>Brown</span>
                    </div>
                </div>
            </div>
            Instructions go here!
        </div>
        <div class="mainCon">
            <div id="map" data-tap-disabled="true">
                <canvas id="overlayCanvas"></canvas>
            </div>
        </div>
    </div>
  <script src="https://unpkg.com/leaflet@latest/dist/leaflet.js"></script>
  <script>

    var mapOptions = {
      center: [19.0760, 72.8777], 
      zoom: 7,
      zoomControl: false,
      tap: false,
      touchZoom: true,
      scrollWheelZoom: true,
      doubleClickZoom: false,
      minZoom: 7,   
      maxZoom: 15   
    };

    const map = L.map('map', mapOptions);
    const eventTypeEl = document.getElementById('eventType');
    const rawCoordsEl = document.getElementById('rawCoords');

    let startX = 0;
    let startY = 0;
    let isDragging = false;

    let x1 = 900; 
    let y1 = 200; 

    let clientX = 0;
    let clientY = 0;

    function logEvent(eventName, e) {
        try {
            if (e && (e.originalEvent?.type || e.type)) {

                const clientX = e.originalEvent?.clientX || e.clientX || e.changedTouches?.[0]?.clientX;
                const clientY = e.originalEvent?.clientY || e.clientY || e.changedTouches?.[0]?.clientY;

                if (clientX !== undefined && clientY !== undefined) {

                    if (eventName === 'movestart' || eventName === 'pointerdown') {
                        // Start dragging
                        startX = clientX;
                        startY = clientY;
                        isDragging = true;

                    } else if ((eventName === 'drag' || eventName === 'touchmove') && isDragging) {
                        // Calculate drag deltas relative to the last position
                        const dragDeltaX = clientX - startX;
                        const dragDeltaY = clientY - startY;

                        // Update the dot position
                        x1 += dragDeltaX;
                        y1 += dragDeltaY;

                        // Update start positions
                        startX = clientX;
                        startY = clientY;
                    } else if (eventName === 'pointerup' || eventName === 'touchend') {
                        // Stop dragging
                        isDragging = false;
                    }

                    // Clear the canvas and redraw the dot at the new position
                    ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                    ctx.beginPath();
                    ctx.arc(x1, y1, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                    ctx.fill();
                } 
            }
        } catch (error) {
            console.error('Logging error:', error);
        }
    }

    L.tileLayer('http://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}').addTo(map);

    const overlayCanvas = document.getElementById('overlayCanvas');
    const ctx = overlayCanvas.getContext('2d');

    overlayCanvas.addEventListener('pointerdown', function(e) { logEvent('pointerdown', e); map.dragging.enable(); });
    overlayCanvas.addEventListener('pointerup', function(e) { logEvent('pointerup', e); map.dragging.disable(); });
    overlayCanvas.addEventListener('touchmove', function(e) { if (e.touches.length === 1) { logEvent('touchmove', e); } });

    overlayCanvas.addEventListener('mouseleave', function () { map.dragging.disable();});

    overlayCanvas.addEventListener('mousedown', function(e) { logEvent('movestart', e); map.dragging.enable(); });
    overlayCanvas.addEventListener('mouseup', function(e) { logEvent('moveend', e); map.dragging.disable(); });
    
    map.on('drag', function(e) { logEvent('drag', e); });

    map.on('resize', function() {
      const size = map.getSize();
      overlayCanvas.width = size.x;
      overlayCanvas.height = size.y;
    });

    map.fire('resize');
    map.dragging.disable();

    let initialPoint = null;
    let pointLatLng = null;

    map.on('zoomstart', function(e) {
      pointLatLng = map.containerPointToLatLng([x1, y1]);
      initialPoint = map.latLngToContainerPoint(pointLatLng);
    });

    map.on('zoomend', function(e) {
      const newPoint = map.latLngToContainerPoint(pointLatLng);
      x1 += (newPoint.x - initialPoint.x);
      y1 += (newPoint.y - initialPoint.y);

      ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
      ctx.beginPath();
      ctx.arc(x1, y1, 5, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
      ctx.fill();

      console.log('Updated point:', x1, y1);
    });

  </script>
</body>
</html>
